name: Alpha Research CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  # Artifact name is scoped to the workflow run by GHA automatically.
  CPP_ARTIFACT: alpha-cpp-so

jobs:
  # ── BUILD-EXTENSION — compile alpha_cpp nanobind .so ONCE, share via artifact ──
  #
  # Every GHA job runs on a fresh VM. Building here and uploading as an artifact
  # means each Python-running job downloads the same binary rather than rebuilding.
  # Runs on ALL triggers (no 'if:') so the artifact exists even on cron schedule.
  build-extension:
    name: "Build alpha_cpp nanobind extension"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libeigen3-dev g++-14

      - name: Install nanobind
        run: pip install nanobind

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-ext-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/cpp/bindings.cpp', 'src/cpp/*.hpp') }}
          restore-keys: cmake-ext-${{ runner.os }}-

      # ── KEY FIX: pin CMake to the exact Python that actions/setup-python installed ──
      # Without this, CMake find_package(Python) may find the system Python
      # (e.g. /usr/bin/python3.12 on ubuntu-24.04) while actions/setup-python
      # put Python 3.13 at /opt/hostedtoolcache/...  The compiled .so then carries
      # the wrong ABI tag and importing it with Python 3.13 raises:
      #   ImportError: std::bad_cast   (nanobind Python C-API struct mismatch)
      # Passing -DPython_EXECUTABLE and -DPython3_EXECUTABLE overrides both
      # the CMake cache (stale from a partial restore-keys hit) and system search.
      - name: CMake configure — alpha_cpp target only
        run: |
          PY_EXE="$(python -c 'import sys; print(sys.executable)')"
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DPython_EXECUTABLE="${PY_EXE}" \
            -DPython3_EXECUTABLE="${PY_EXE}" \
            -G Ninja

      - name: CMake build — alpha_cpp only
        run: cmake --build build --target alpha_cpp --parallel

      # Smoke-test: the .so must be importable by the SAME interpreter before upload.
      # Catches ABI or linker problems before they propagate to downstream jobs.
      - name: Verify import
        run: |
          python - <<'EOF'
          import sys, glob, pathlib
          sos = glob.glob("build/alpha_cpp*.so")
          assert sos, "alpha_cpp .so not found in build/"
          sys.path.insert(0, str(pathlib.Path(sos[0]).parent))
          import alpha_cpp
          print(f"alpha_cpp OK — doc: {alpha_cpp.__doc__[:60]}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CPP_ARTIFACT }}
          # Glob matches the ABI-tagged name CMake produces, e.g.:
          #   alpha_cpp.cpython-313-x86_64-linux-gnu.so
          path: build/alpha_cpp*.so
          retention-days: 1

  # ── Python 3.13 lint + pytest ─────────────────────────────────────────────
  python-test:
    name: "Python 3.13 — lint & pytest"
    runs-on: ubuntu-24.04
    needs: [build-extension]
    env:
      PYTHONPATH: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      # Download the pre-built .so into build/ so PYTHONPATH resolves it.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CPP_ARTIFACT }}
          path: ${{ github.workspace }}/build/

      - name: Lint (ruff)
        run: ruff check src/python/ scripts/ tests/python/ --select E,F,I,UP --ignore E501

      - name: Run pytest
        run: |
          pytest tests/python/ -v --tb=short \
                 --cov=src/python/alpha_research \
                 --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  # ── C++26 build + Google Test ─────────────────────────────────────────────
  cpp-test:
    name: "C++26 — CMake build & Google Test"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libeigen3-dev git g++-14

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install nanobind
        run: pip install nanobind

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt','src/cpp/**') }}
          restore-keys: cmake-${{ runner.os }}-

      # Same Python pin as build-extension for ABI consistency.
      - name: CMake configure (g++-14, C++23)
        run: |
          PY_EXE="$(python -c 'import sys; print(sys.executable)')"
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DPython_EXECUTABLE="${PY_EXE}" \
            -DPython3_EXECUTABLE="${PY_EXE}" \
            -G Ninja

      - name: CMake build
        run: cmake --build build --parallel

      - name: CTest (Google Test)
        run: ctest --test-dir build --output-on-failure

  # ── Bazel smoke test ──────────────────────────────────────────────────────
  bazel-smoke:
    name: "Bazel 7.4.1 — smoke test"
    runs-on: ubuntu-24.04
    needs: [python-test, build-extension]
    env:
      PYTHONPATH: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CPP_ARTIFACT }}
          path: ${{ github.workspace }}/build/

      - name: Install Bazelisk
        run: |
          curl -fsSL \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.22.0/bazelisk-linux-amd64" \
            -o ${{ github.workspace }}/bazel
          chmod +x ${{ github.workspace }}/bazel
          echo "${{ github.workspace }}" >> $GITHUB_PATH

      - name: Bazel version (reads .bazelversion → 7.4.1)
        run: bazel version

      - name: Smoke — backtest via runner.py
        env:
          N_DAYS: "300"
          N_CURRENCIES: "5"
        run: python scripts/runner.py backtest

  # ── Daily signal decay monitor ────────────────────────────────────────────
  signal-monitor:
    name: "Signal Decay Monitor (daily)"
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # build-extension has no 'if:' guard → it always runs, including on cron.
    needs: [build-extension]
    env:
      PYTHONPATH: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CPP_ARTIFACT }}
          path: ${{ github.workspace }}/build/

      - name: Run decay monitor
        id: monitor
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          N_DAYS: "500"
        run: |
          python scripts/runner.py monitor 2>&1 | tee monitor_output.txt
          if grep -q "DECAY ALERT" monitor_output.txt; then
            echo "decay_detected=true"  >> "$GITHUB_OUTPUT"
          else
            echo "decay_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Slack — decay alert
        if: steps.monitor.outputs.decay_detected == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text":"⚠️ *Alpha Research — Signal Decay Alert*\nRepo: ${{ github.repository }}\nIC half-life < 30d or rolling IC < 2%.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: Slack — monitor failed
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text":"🔴 *Alpha Research — Monitor CI FAILED*\nRepo: ${{ github.repository }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: Upload monitor output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-output-${{ github.run_id }}
          path: monitor_output.txt

  # ── Full backtest on push to main ─────────────────────────────────────────
  full-backtest:
    name: "Full Backtest (push to main)"
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python-test, cpp-test, build-extension]
    env:
      PYTHONPATH: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CPP_ARTIFACT }}
          path: ${{ github.workspace }}/build/

      - name: Run full backtest
        env:
          N_DAYS: "2520"
          N_CURRENCIES: "8"
        run: python scripts/runner.py backtest 2>&1 | tee backtest_output.txt

      - name: Quality gate
        run: |
          python - << 'EOF'
          import re, sys
          txt = open("backtest_output.txt").read()
          sharpes = [float(x) for x in re.findall(r"Sharpe.*?([0-9]+\.[0-9]+)", txt)]
          print("Sharpe values found:", sharpes if sharpes else "none (synthetic mode OK)")
          EOF

      - name: Slack — backtest complete
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text":"✅ *Alpha Research — Full Backtest Complete*\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Results>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_id }}
          path: backtest_output.txt
